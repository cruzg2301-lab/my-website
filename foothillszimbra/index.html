<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foothills Communications Sign In</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-bg">
    <div class="login-card">
      <div class="logo-area">
        <img src="logo 1.jpeg" alt="Foothills logo" class="logo-img" />
      </div>
	  
      <h1>Sign In</h1>
      <form id="loginForm" class="login-form" action="#" method="post">
        <input type="text" id="username" name="username" placeholder="Username" required />
        <input type="password" id="password" name="password" placeholder="Password" required />
        <div class="form-actions">
          <button type="submit" class="primary-btn">Sign In</button>
          <label class="stay-signed">
            <input type="checkbox" name="remember" value="Yes" />
            Stay signed in
          </label>
        </div>
      </form>
      <div class="card-footer">
        <div class="webapp-select">
          <label>Web App Version</label>
          <div class="select-row">
            <select>
              <option>Default</option>
              <option>Classic</option>
              <option>Modern</option>
            </select>
            <div class="help-icon">?</div>
          </div>
        </div>
      </div>
    </div>
    <div class="copyright-text">
      Copyright © 2005-2026 Synacor, Inc. All rights reserved. "Zimbra" is a registered trademark of Synacor, Inc.
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
